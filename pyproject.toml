[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-link-linux"
version = "1.0.0"
authors = [{ name = "Fazri Gading", email = "fazrigading@gmail.com" }]
description = "iPhone Link Linux - Native iPhone Mirroring and Control for Linux"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymobiledevice3>=11.28",
    "pywebview>=5.0",
    "pystray>=0.19",
    "Pillow>=10.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["handset*"]
