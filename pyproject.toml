[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-link"
version = "1.0.0"
authors = [{ name = "Kelvin Daniyar", email = "kelvindaniyar@users.noreply.github.com" }]
description = "iPhone Link - Native iPhone Mirroring and Control for Windows 11"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pymobiledevice3>=11.28",
    "pywebview>=5.0",
    "pycaw>=20230407",  # Windows-only audio: only referenced on Windows
    "PyQt6>=6.5",  # Linux UI backend for pywebview when GTK is unavailable
    # Linux USB stack: libimobiledevice (including usbmuxd) must be installed and running.
    # This package list cannot express system packages, so the README/Linux notes carry the requirement.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["handset*"]
